# Dependabot version updates: opens pull requests to keep dependencies current, so
# security fixes arrive as reviewable PRs (CI runs tests, build, and the audit gate on each).
# Minor and patch updates are grouped into one PR per project to keep the noise down;
# major versions get their own PR because they can need code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      website-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # MUI 5 -> 9 spans several breaking releases (e.g. the Grid API used on the
      # Projects page) and needs a planned migration. Minor/patch updates still flow.
      # Remove this once the site is migrated.
      - dependency-name: "@mui/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      functions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
