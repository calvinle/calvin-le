# Runs on every push and pull request to main, plus weekly so newly disclosed
# vulnerabilities are caught even when nothing has been pushed.
#
# The website build needs the Firebase web config. These NEXT_PUBLIC_* values are not
# secret (they ship in the site's JavaScript), so they're stored as repository variables:
# GitHub repo > Settings > Secrets and variables > Actions > Variables tab.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC

# Least privilege: these jobs only need to read the repository
permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on high/critical advisories in shipped dependencies unless reviewed
      # and listed in security/audit-allowlist.json
      - name: Security audit gate
        run: node scripts/audit-gate.mjs website .

      # Includes ResumePdf.test.js, which fails if the committed resume PDF is out of
      # date with components/resumeData.js (fix: npm run resume:pdf, then commit)
      - name: Run tests
        run: npm test -- --ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      # Match the Cloud Functions runtime ("engines": {"node": "24"} in functions/package.json)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit gate
        run: node ../scripts/audit-gate.mjs functions .

      # Same check firebase.json runs before every functions deploy
      - name: Lint
        run: npm run lint
